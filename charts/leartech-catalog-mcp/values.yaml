nameOverride: ""
fullnameOverride: ""

image:
  repository: ""  # set by release.yaml promote-changelog step
  tag: ""         # set by release.yaml promote-changelog step
  pullPolicy: IfNotPresent

replicaCount: 2

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  name: leartech-catalog-mcp
  type: ClusterIP
  port: 8080
  externalPort: 8080

# Ingress annotations + overrides (domain comes from jxRequirements)
ingress:
  annotations: {}
  pathType: ImplementationSpecific
  labels: {}

# jxRequirements — auto-populated from jx-values.yaml per cluster/env.
# Do NOT hardcode domains here.
jxRequirements:
  ingress:
    annotations: {}
    apiVersion: "networking.k8s.io/v1"
    domain: ""
    externalDNS: false
    namespaceSubDomain: -jx.
    serviceType: ""
    tls:
      email: ""
      enabled: false
      production: false
      secretName: ""

knativeDeploy: false

# Runtime config that ends up in the ConfigMap + mounted / env-injected.
# Override per env via configs/<env>.yaml or preview helmfile set: block.
config:
  cluster: ""  # "gcp" | "az" — set from .Values.global or env-specific
  logLevel: info

# OpenTelemetry traces — emitted via OTLP HTTP to the cluster's Tempo.
# Default endpoint resolves on both GCP and AZ clusters (same service name
# in jx-observability). Set tracing.enabled=false to fully no-op the SDK
# (sets OTEL_TRACES_DISABLED=1 in the container env).
tracing:
  enabled: true
  endpoint: tempo.jx-observability:4318

# Postgres wiring — DB credentials come from ExternalSecret (ESO) referencing
# the cluster's secret backend (GSM on GCP, AKV on Azure).
database:
  # Master switch. Default true = real service with Postgres. Set to false
  # for the template's own self-deploy or any "shell-mode" preview where
  # no DB is needed — `/health/ready` will pass without a DB ping.
  enabled: true

  # Name of the database within the shared Postgres cluster. Per golden-std:
  # database-per-service, no cross-DB joins.
  name: leartech_catalog_mcp
  # Secret name ESO syncs from the cloud backend.
  secretName: leartech-catalog-mcp-db
  # Key inside that secret holding the full DSN.
  secretKey: DATABASE_URL

  # ExternalSecret (External Secrets Operator, external-secrets.io/v1). The
  # per-cluster ClusterSecretStore is the GLOBAL `externalSecrets.clusterStore`
  # (below); only the per-service remote key is set here, in the per-cluster
  # install-values. Disable for local/kind or if you provision the secret
  # by another means.
  externalSecret:
    enabled: true
    # Per-service key/path in the cluster's secret backend, set by the
    # per-cluster install-values (e.g. GCP GSM `catalog-mcp-db-dsn`, or the
    # equivalent Vault path on Azure).
    remoteKey: ""

# Per-cluster ESO store — set ONCE per GitOps repo in jx-global-values.yaml
# (gcp-secrets-manager on GCP, vault-backend on Azure). Shared by every
# service on the cluster; do NOT set per-service.
externalSecrets:
  clusterStore: ""

migrations:
  enabled: true
  image:
    repository: ghcr.io/kukymbr/goose-docker
    tag: "3.27.1"

# go-common v1.1.0 auth.VerifierConfig — populated as env vars with the
# AUTH_ prefix. envconfig.Process on the embedded `Auth auth.VerifierConfig
# `envconfig:"AUTH"`` field maps each Go field name (uppercased) onto
# AUTH_<FIELDNAME>. go-common's inbound-only Verifier needs ONLY
# `Issuer` + `Audience` → env vars AUTH_ISSUER + AUTH_AUDIENCE.
#
# catalog-mcp is a PURE RESOURCE SERVER (validates JWTs, never mints
# them), so we deliberately use the Verifier path — no client_id /
# client_secret / server_url required or consulted. This closed the
# fail-closed crashloop where catalog was mis-using the outbound
# ServiceAuthClient path for pure inbound validation and refused to
# boot with "required config missing: LEARTECH_AUTH_SERVER_URL,
# LEARTECH_AUTH_CLIENT_ID, LEARTECH_AUTH_CLIENT_SECRET" — creds it
# never actually needed.
#
# C1 (auth hardening) contract:
#   - `required: true` is the default. go-common v1.1.0 NewVerifier
#     REFUSES to construct with an empty Issuer / Audience — a mis-wired
#     GitOps SOURCE overlay crashes the pod on boot instead of silently
#     serving unvalidated tokens.
#   - `audience` defaults to the canonical internal audience for this
#     service, `leartech-catalog-mcp`. Tokens with any other `aud`
#     are rejected by the inbound middleware.
#   - `issuer` is intentionally empty here — per-cluster GitOps SOURCE
#     config (helmfiles/.../configs/leartech-catalog-mcp.yaml) supplies
#     the concrete Hydra URL. Preview `values.yaml.gotmpl` overrides
#     with a placeholder so previews boot 1/1 without a live Hydra.
auth:
  required: true
  issuer: ""
  audience: leartech-catalog-mcp

# Template-only feature flags. These exist so the golden-template's
# staging deploys can prove peer SDK + auth wiring via /api/v1/fleet-test.
# Cloning consumers should DELETE this whole `fleetTest` stanza along
# with internal/handlers/fleettest.go, the peer-SDK go.mod deps, and
# the chart env var below — none of it is part of the generic service
# skeleton.
fleetTest:
  # When true the deployment exposes /api/v1/fleet-test which calls peer
  # golden templates via their published Go SDKs. Off by default so PR
  # previews + ad-hoc deploys don't pull a network path that depends on
  # peers being reachable. Staging overlays set this to true.
  enabled: false

probes:
  liveness: {}
  readiness: {}
  startup: {}

resources: {}  # library defaults apply if empty

podAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
