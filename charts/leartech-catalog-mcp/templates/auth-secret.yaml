# Auth Secret — C1 (auth hardening) fail-closed wiring.
#
# Rendered ONLY when a literal `.Values.auth.clientSecret` is supplied
# (preview overlay: preview/values.yaml.gotmpl). In production the
# per-cluster GitOps SOURCE overlay leaves `auth.clientSecret` empty
# and provides the same-named k8s Secret out-of-band via an
# ExternalSecret (external-secrets.io) so real credentials never live
# in helm values — the deployment's secretKeyRef `optional: true` picks
# whichever one exists.
#
# Preview rationale:
#   - go-common v1.0.0 NewServiceClient refuses to construct when
#     ClientSecret is empty (fail-closed contract). Without this
#     Secret the pod crash-loops on boot with:
#       "auth: refusing to start — required config missing: LEARTECH_AUTH_CLIENT_SECRET"
#   - Preview pods don't have a real Hydra to authenticate against; the
#     issuer is a placeholder (hydra.preview-default.invalid) and JWKS
#     lookups fail lazily — every /api/v1 request returns 401 by
#     design (the fail-closed proof C1 requires).
#   - The clientSecret literal here is throwaway; it satisfies the
#     construction-time non-empty check but is never used to obtain a
#     token (client_credentials against the placeholder issuer 404s).
#
# Never set `.Values.auth.clientSecret` in staging/production values —
# leave it empty and rely on ExternalSecret for real credentials.
{{- if and .Values.auth.required .Values.auth.clientSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "leartech.fullname" . }}-auth
  labels:
    {{- include "leartech.labels" . | nindent 4 }}
type: Opaque
stringData:
  clientSecret: {{ .Values.auth.clientSecret | quote }}
{{- end }}
