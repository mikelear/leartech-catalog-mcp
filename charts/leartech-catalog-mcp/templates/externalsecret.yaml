# ExternalSecret — syncs the database DSN from the cluster's secret backend
# via the External Secrets Operator (ESO, external-secrets.io/v1).
#
# Cluster-agnostic by design:
#   - the per-cluster ClusterSecretStore name comes from the GLOBAL
#     `externalSecrets.clusterStore` (gcp-secrets-manager on GCP,
#     vault-backend on Azure — set ONCE per GitOps repo in jx-global-values.yaml);
#   - the per-service remote key comes from `database.externalSecret.remoteKey`
#     (e.g. catalog-mcp-db-dsn), set in the per-cluster install-values.
#
# The synced k8s Secret holds the DSN under `database.secretKey` (DATABASE_URL),
# which the deployment + migrate Job read. Inert until a cluster enables the DB.
{{- if and .Values.database.enabled (.Values.database.externalSecret.enabled | default true) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.secretName }}
  labels:
    {{- include "leartech.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ required "externalSecrets.clusterStore is required (per-cluster global)" .Values.externalSecrets.clusterStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.database.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.database.secretKey }}
      remoteRef:
        key: {{ required "database.externalSecret.remoteKey is required (per-service)" .Values.database.externalSecret.remoteKey }}
{{- end }}
