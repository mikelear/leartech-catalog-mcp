# ExternalSecret — syncs the database DSN from the cluster's secret backend
# (GSM on GCP, AKV on Azure).
#
# Both clusters run the LEGACY `kubernetes-client.io/v1` ExternalSecret CRD,
# NOT the newer `external-secrets.io/v1` operator. The chart must match the
# installed CRD; see leartech-auth-service for the proven precedent.
#
# Cluster-aware toggles: gcp.enabled / azure.enabled are flipped per-cluster
# in install-values (jx-build-cluster-{gsm,akv}). Default values.yaml leaves
# both off — the chart is inert until a cluster wires it on.
#
# If you don't need ESO (e.g. running in a local cluster), set
# .Values.database.externalSecret.enabled=false and provision the secret
# by another means.
{{- if and .Values.database.enabled (.Values.database.externalSecret.enabled | default true) }}
{{- if .Values.database.externalSecret.gcp.enabled }}
apiVersion: kubernetes-client.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.secretName }}
  labels:
    {{- include "leartech.labels" . | nindent 4 }}
spec:
  backendType: gcpSecretsManager
  projectId: {{ .Values.database.externalSecret.gcp.projectId | default "product-first" }}
  data:
    - key: {{ .Values.database.externalSecret.gcp.secretKey | required ".Values.database.externalSecret.gcp.secretKey required" }}
      name: dsn
{{- end }}
{{- if .Values.database.externalSecret.azure.enabled }}
apiVersion: kubernetes-client.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.secretName }}
  labels:
    {{- include "leartech.labels" . | nindent 4 }}
spec:
  backendType: azureKeyVault
  keyVaultName: {{ .Values.database.externalSecret.azure.keyVaultName | required ".Values.database.externalSecret.azure.keyVaultName required" }}
  data:
    - key: {{ .Values.database.externalSecret.azure.secretKey | required ".Values.database.externalSecret.azure.secretKey required" }}
      name: dsn
{{- end }}
{{- end }}
