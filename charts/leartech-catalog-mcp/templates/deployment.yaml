apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "leartech.fullname" . }}
  labels:
    {{- include "leartech.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "leartech.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "leartech.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "leartech.serviceAccountName" . }}
      securityContext:
        {{- include "leartech.podSecurityContext" . | nindent 8 }}
      containers:
      - name: app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: CLUSTER_ID
          value: {{ .Values.config.cluster | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.config.logLevel | quote }}
        {{- if .Values.database.enabled }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.database.secretName }}
              key: {{ .Values.database.secretKey }}
        {{- end }}
        # THE STANDARD INBOUND AUTH ENV SET. Two public values, both required,
        # no secret and no toggle.
        #
        # These names are estate-standard and match go-common's own env tags.
        # The chart used to render AUTH_REQUIRED / AUTH_ISSUER / AUTH_AUDIENCE
        # — the first a switch that mounted /api/v1 with no middleware at all
        # when false, the rest envconfig-derived names matching nothing any
        # other service renders. Both are gone: auth is unconditional, and a
        # missing issuer or audience fails the pod at boot rather than
        # serving open.
        - name: LEARTECH_AUTH_ISSUER
          value: {{ required "auth.issuer is required — a resource server that cannot name its issuer must not start" .Values.auth.issuer | quote }}
        # The RFC 8707 `aud` claim enforced on inbound tokens. Canonical value
        # is `leartech-catalog-mcp`.
        - name: LEARTECH_AUTH_AUDIENCE
          value: {{ required "auth.audience is required — RFC 8707 audience binding is not optional" .Values.auth.audience | quote }}
        {{- if .Values.auth.jwksURL }}
        # Optional explicit JWKS URL. Empty by default; the Verifier derives
        # Issuer + /.well-known/jwks.json. Set only when the issuer advertises
        # its JWKS at a non-standard path.
        - name: LEARTECH_AUTH_JWKS_URL
          value: {{ .Values.auth.jwksURL | quote }}
        {{- end }}
        # Template-only — see values.yaml `fleetTest` stanza. Drop this
        # env var when cloning the template into a real service.
        - name: FLEET_TEST_ENABLED
          value: {{ .Values.fleetTest.enabled | quote }}
        {{- if .Values.tracing.enabled }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.tracing.endpoint | quote }}
        {{- else }}
        - name: OTEL_TRACES_DISABLED
          value: "1"
        {{- end }}
        securityContext:
          {{- include "leartech.containerSecurityContext" . | nindent 10 }}
        livenessProbe:
          {{- include "leartech.livenessProbe" . | nindent 10 }}
        readinessProbe:
          {{- include "leartech.readinessProbe" . | nindent 10 }}
        startupProbe:
          {{- include "leartech.startupProbe" . | nindent 10 }}
        resources:
          {{- include "leartech.resources" . | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      # readOnlyRootFilesystem=true requires writable volumes for anything that writes
      - name: tmp
        emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
