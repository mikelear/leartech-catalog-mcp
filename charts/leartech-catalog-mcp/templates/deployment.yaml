apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "leartech.fullname" . }}
  labels:
    {{- include "leartech.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "leartech.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "leartech.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "leartech.serviceAccountName" . }}
      securityContext:
        {{- include "leartech.podSecurityContext" . | nindent 8 }}
      containers:
      - name: app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: CLUSTER_ID
          value: {{ .Values.config.cluster | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.config.logLevel | quote }}
        {{- if .Values.database.enabled }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.database.secretName }}
              key: {{ .Values.database.secretKey }}
        {{- end }}
        # C1 (auth hardening) — AUTH_REQUIRED gates the bearer middleware.
        # Chart default is `true`; a mis-wired GitOps SOURCE overlay
        # (no issuer, no audience) crashes the pod on boot instead of
        # silently serving unvalidated tokens. Preview `values.yaml.gotmpl`
        # supplies a placeholder issuer so previews boot 1/1 with
        # AUTH_REQUIRED=true — the JWKS is fetched lazily so an
        # unreachable placeholder is fine while /health/live remains a
        # bypass path.
        - name: AUTH_REQUIRED
          value: {{ .Values.auth.required | quote }}
        {{- if .Values.auth.required }}
        # go-common v1.1.0 inbound-only Verifier envs. envconfig wires
        # them via the AUTH_ prefix so the Go field names map to
        # AUTH_<FIELDNAME>: VerifierConfig.Issuer   → AUTH_ISSUER,
        # VerifierConfig.Audience → AUTH_AUDIENCE.
        #
        # catalog-mcp is a PURE RESOURCE SERVER — it validates JWTs but
        # never mints them, so NO LEARTECH_AUTH_SERVER_URL / CLIENT_ID /
        # CLIENT_SECRET are needed. Requiring them before was a
        # mis-wiring that crashloop'd the pod fail-closed with
        # "required config missing" — this initiative closes that.
        - name: AUTH_ISSUER
          value: {{ .Values.auth.issuer | quote }}
        # Audience is the RFC 8707 `aud` claim we enforce on inbound
        # tokens. Canonical value is `leartech-catalog-mcp` — mirrors
        # the orch/agent/mcp C1 pattern. Per-cluster GitOps MAY
        # override for staging quirks, but production defaults to the
        # canonical audience.
        - name: AUTH_AUDIENCE
          value: {{ .Values.auth.audience | quote }}
        {{- if .Values.auth.jwksURL }}
        # Optional explicit JWKS URL — empty by default; Verifier
        # derives Issuer + /.well-known/jwks.json. Set only when the
        # issuer advertises its JWKS at a non-standard path.
        - name: AUTH_JWKSURL
          value: {{ .Values.auth.jwksURL | quote }}
        {{- end }}
        {{- end }}
        # Template-only — see values.yaml `fleetTest` stanza. Drop this
        # env var when cloning the template into a real service.
        - name: FLEET_TEST_ENABLED
          value: {{ .Values.fleetTest.enabled | quote }}
        {{- if .Values.tracing.enabled }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.tracing.endpoint | quote }}
        {{- else }}
        - name: OTEL_TRACES_DISABLED
          value: "1"
        {{- end }}
        securityContext:
          {{- include "leartech.containerSecurityContext" . | nindent 10 }}
        livenessProbe:
          {{- include "leartech.livenessProbe" . | nindent 10 }}
        readinessProbe:
          {{- include "leartech.readinessProbe" . | nindent 10 }}
        startupProbe:
          {{- include "leartech.startupProbe" . | nindent 10 }}
        resources:
          {{- include "leartech.resources" . | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      # readOnlyRootFilesystem=true requires writable volumes for anything that writes
      - name: tmp
        emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
