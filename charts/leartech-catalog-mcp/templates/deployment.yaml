apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "leartech.fullname" . }}
  labels:
    {{- include "leartech.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "leartech.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "leartech.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "leartech.serviceAccountName" . }}
      securityContext:
        {{- include "leartech.podSecurityContext" . | nindent 8 }}
      containers:
      - name: app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: CLUSTER_ID
          value: {{ .Values.config.cluster | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.config.logLevel | quote }}
        {{- if .Values.database.enabled }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.database.secretName }}
              key: {{ .Values.database.secretKey }}
        {{- end }}
        # C1 (auth hardening) — AUTH_REQUIRED gates the bearer middleware.
        # Chart default is `true`; a mis-wired GitOps SOURCE overlay
        # (no issuer, no audience) crashes the pod on boot instead of
        # silently serving unvalidated tokens. Preview `values.yaml.gotmpl`
        # supplies a placeholder issuer so previews boot 1/1 with
        # AUTH_REQUIRED=true — the JWKS is fetched lazily so an
        # unreachable placeholder is fine while /health/live remains a
        # bypass path.
        - name: AUTH_REQUIRED
          value: {{ .Values.auth.required | quote }}
        {{- if .Values.auth.required }}
        # go-common v1.0.0 fail-closed envs (LEARTECH_AUTH_* is the
        # library-side name; envconfig wires them via the AUTH_ prefix
        # so the Go field names map to AUTH_<FIELDNAME>).
        - name: AUTH_SERVERURL
          value: {{ .Values.auth.issuer | quote }}
        - name: AUTH_CLIENTID
          value: {{ .Values.auth.clientId | quote }}
        # AUTH_CLIENTSECRET has two wiring modes:
        #   1) preview / local — a literal `auth.clientSecret` in values
        #      renders directly as `value:`. Preview environments have no
        #      backend secret store to sync from; the literal is a
        #      throwaway placeholder that only satisfies go-common
        #      v1.0.0's non-empty ClientSecret construction check
        #      (client_credentials against the placeholder issuer 404s).
        #      Never put a real credential in values.yaml.
        #   2) staging / production — leave `auth.clientSecret` empty in
        #      per-cluster values and provision the same-named k8s
        #      Secret (`<release>-auth`, key `clientSecret`) via an
        #      ExternalSecret owned by the cluster GitOps SOURCE overlay
        #      (external-secrets.io — the leartech convention captured
        #      by the semgrep rule `leartech-no-plain-k8s-secret`).
        #      The `secretKeyRef` here reads that Secret.
        #
        # `optional: true` on the secretKeyRef prevents the pod from
        # blocking on Secret existence during the ExternalSecret sync
        # window; if the env stays empty, go-common's fail-closed
        # construction check crashes the pod with a clear
        # "LEARTECH_AUTH_CLIENT_SECRET missing" error.
        {{- if .Values.auth.clientSecret }}
        - name: AUTH_CLIENTSECRET
          value: {{ .Values.auth.clientSecret | quote }}
        {{- else }}
        - name: AUTH_CLIENTSECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "leartech.fullname" . }}-auth
              key: clientSecret
              optional: true
        {{- end }}
        # Audience is the RFC 8707 `aud` claim we enforce on inbound
        # tokens. Canonical value is `leartech-catalog-mcp` — mirrors
        # the orch/agent/mcp C1 pattern. Per-cluster GitOps MAY
        # override for staging quirks, but production defaults to the
        # canonical audience.
        - name: AUTH_AUDIENCE
          value: {{ .Values.auth.audience | quote }}
        {{- end }}
        # Template-only — see values.yaml `fleetTest` stanza. Drop this
        # env var when cloning the template into a real service.
        - name: FLEET_TEST_ENABLED
          value: {{ .Values.fleetTest.enabled | quote }}
        {{- if .Values.tracing.enabled }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.tracing.endpoint | quote }}
        {{- else }}
        - name: OTEL_TRACES_DISABLED
          value: "1"
        {{- end }}
        securityContext:
          {{- include "leartech.containerSecurityContext" . | nindent 10 }}
        livenessProbe:
          {{- include "leartech.livenessProbe" . | nindent 10 }}
        readinessProbe:
          {{- include "leartech.readinessProbe" . | nindent 10 }}
        startupProbe:
          {{- include "leartech.startupProbe" . | nindent 10 }}
        resources:
          {{- include "leartech.resources" . | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      # readOnlyRootFilesystem=true requires writable volumes for anything that writes
      - name: tmp
        emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
