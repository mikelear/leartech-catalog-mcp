definitions:
  handlers.ExampleResponse:
    properties:
      message:
        example: hello
        type: string
      service:
        example: leartech-catalog-mcp
        type: string
    type: object
  handlers.fleetTestResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/handlers.peerResult'
        type: array
      success:
        type: boolean
      summary:
        type: string
    type: object
  handlers.peerResult:
    properties:
      duration_ms:
        type: integer
      http_code:
        type: integer
      message:
        type: string
      ok:
        type: boolean
      peer:
        type: string
    type: object
info:
  contact: {}
  description: Read-only inventory of leartech services for BA/Architect agents. Foundation
    for V6-P10 + the new-product layer.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Catalog MCP API
  version: 0.0.1
paths:
  /api/v1/example:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ExampleResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Example endpoint
      tags:
      - example
  /api/v1/fleet-test:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.fleetTestResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Fleet test endpoint — calls peer template SDKs to prove cross-service
        auth + SDK wiring.
      tags:
      - fleet-test
  /health/live:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe
      tags:
      - health
  /health/ready:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness probe
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: Bearer token (JWT) issued by the leartech auth service.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
